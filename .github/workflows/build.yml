name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EyeBreak.app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Build
        run: bash scripts/build.sh

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP=dist/EyeBreak.app
          test -x "$APP/Contents/MacOS/EyeBreak"
          test -f "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/EyeBreak"
          codesign --verify --verbose "$APP"

      - name: Package
        run: |
          set -euo pipefail
          NAME="EyeBreak-${GITHUB_REF_NAME//\//-}-macos-$(uname -m)"
          ditto -c -k --sequesterRsrc --keepParent dist/EyeBreak.app "$NAME.zip"
          echo "ARCHIVE=$NAME.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: EyeBreak-app
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" --generate-notes --title "$GITHUB_REF_NAME"
